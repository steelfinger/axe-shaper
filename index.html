    <script>
      // Firebase's web.app hostname is useful for infrastructure, but it is
      // not a public URL. Redirect before the app loads while retaining a
      // shared route, query, or hash.
      if (window.location.hostname === 'axe-shaper-web.web.app') {
        window.location.replace(`https://axeshaper.com${window.location.pathname}${window.location.search}${window.location.hash}`);
      } else {
        // All SPA routes share this document, so canonicalize the actual path
        // rather than declaring every page to be the home page.
        document.write(`<link rel="canonical" href="https://axeshaper.com${window.location.pathname}" />`);
      }
    </script>
