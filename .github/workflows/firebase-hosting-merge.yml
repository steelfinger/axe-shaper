# Originally auto-generated by the Firebase CLI, since reworked.
#
# This lane no longer publishes. A push to main deploys to the live channel of
# the separate `axe-shaper-staging` project (https://axe-shaper-staging.web.app);
# going live is a `v*` tag, handled by firebase-hosting-release.yml. See
# CLAUDE.md, "Deploying is a tag, not a push".
#
# Staging is its own Firebase project, not a channel on axe-shaper-web, so
# that the sharing backend's Hosting rewrites never route a staging or PR
# build to production Functions and data. See docs/sharing-operations.md,
# "Standalone Phase 0a".
#
# Staging is not a nicety. Before this split, "does main still build and
# deploy" was proven by the live site changing, and nothing else. Stop
# publishing on every push and that signal disappears - which is exactly the
# failure CLAUDE.md records, where VIEWER3D_RELEASE_TOKEN was missing and every
# deploy failed silently for ten days. Deploying main somewhere on every push
# keeps a broken `build:site` or an expired token surfacing immediately,
# instead of at release time when you are waiting on App Store review.

name: Deploy to Firebase Hosting staging on merge
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hosting-staging
  cancel-in-progress: false
jobs:
  # A newer main commit's Verify run owns staging. Superseded runs end as a
  # skipped deploy job, not a failure: a red staging run has to keep meaning
  # the build or a credential broke.
  latest_main:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.compare.outputs.current }}
    steps:
      - id: compare
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$latest" = "$VERIFIED_SHA" ]; then
            echo current=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A newer main commit ($latest) exists; its Verify run owns staging."
            echo current=false >> "$GITHUB_OUTPUT"
          fi
  build_and_deploy_staging:
    needs: latest_main
    if: ${{ needs.latest_main.outputs.current == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm install --global firebase-tools@15.26.0
      - run: npm run functions:build

      # Builds this site and composes the pinned viewer3d bundle into
      # dist/viewer3d. firebase.json has no predeploy hook, so this is the
      # only build; a bare `firebase deploy` would ship whatever is in dist/.
      #
      # VITE_SCHEMA_9_AUTHORING turns on output-jack (schema 8) and body
      # material/finish (schema 9) authoring, as firebase-hosting-release.yml
      # does from v1.3.2, so staging shows what a tag of main would publish.
      # See CLAUDE.md, "Schema 8 and 9 authoring".
      - run: npm run build:site
        env:
          GH_TOKEN: ${{ secrets.VIEWER3D_RELEASE_TOKEN }}
          VITE_SCHEMA_9_AUTHORING: '1'
          # The Create link dialog needs the /api/** sharing backend, which
          # only this project has. Never set in the release or PR workflows.
          VITE_SHARING: '1'
          # Public Firebase web config and reCAPTCHA Enterprise site key for
          # App Check on Create link. Repository Actions *variables*, not
          # secrets - they ship in the bundle - kept out of source only because
          # secret scanning flags the API key pattern. See src/sharing/appCheck.ts.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
      - name: Authenticate Firebase deployment
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AXE_SHAPER_SHARING_STAGING }}
        run: |
          node -e "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/firebase-deploy.json', process.env.FIREBASE_SERVICE_ACCOUNT, {mode: 0o600})"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-deploy.json" >> "$GITHUB_ENV"
      - name: Deploy backend and pinned Hosting together
        run: node scripts/deploy-sharing.ts staging
      - name: Verify deployed policy and routes
        run: npm run sharing:smoke -- https://axe-shaper-staging.web.app
      - name: Remove deployment credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-deploy.json"
