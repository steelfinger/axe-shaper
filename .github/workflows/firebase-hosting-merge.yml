# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Builds this site and composes the pinned viewer3d bundle into
      # dist/viewer3d. firebase.json has no predeploy hook, so this is the
      # only build; a bare `firebase deploy` would ship whatever is in dist/.
      - run: npm run build:site
        env:
          GH_TOKEN: ${{ secrets.VIEWER3D_RELEASE_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AXE_SHAPER_WEB }}
          channelId: live
          projectId: axe-shaper-web
