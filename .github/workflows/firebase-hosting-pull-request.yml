# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Builds this site and composes the pinned viewer3d bundle into
      # dist/viewer3d. firebase.json has no predeploy hook, so this is the
      # only build; a bare `firebase deploy` would ship whatever is in dist/.
      - run: npm run build:site
        env:
          GH_TOKEN: ${{ secrets.VIEWER3D_RELEASE_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AXE_SHAPER_WEB }}
          projectId: axe-shaper-web
