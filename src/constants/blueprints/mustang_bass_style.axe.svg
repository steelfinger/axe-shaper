    <!-- Front Routed Cavities (control cavities, etc. - under pickup hardware) -->
    

    <!-- Pickup routing cavities and visible cover cut lines (above front routes) -->
    
          <g transform="translate(0, 230) rotate(0)">
            <path d="M -18.83 0.39 C -16.36 0.86, -17.51 3.86, -17.25 5.64 C -17.16 12.43, -17.41 19.24, -17.12 26.01 C -16.49 29.69, -12.62 31.55, -9.19 31.08 C 9.49 31.06, 28.17 31.13, 46.85 31.05 C 50.82 30.78, 53.10 26.68, 52.55 23.02 C 52.47 16.11, 52.72 9.18, 52.42 2.28 C 51.80 -1.39, 47.93 -3.26, 44.49 -2.79 C 35.94 -2.79, 27.39 -2.79, 18.83 -2.79 C 16.36 -3.25, 17.51 -6.25, 17.25 -8.04 C 17.17 -14.03, 17.41 -20.04, 17.12 -26.01 C 16.49 -29.69, 12.62 -31.55, 9.18 -31.08 C -9.50 -31.06, -28.17 -31.13, -46.85 -31.05 C -50.82 -30.78, -53.10 -26.68, -52.55 -23.02 C -52.47 -16.91, -52.71 -10.78, -52.42 -4.68 C -51.80 -1.01, -47.93 0.86, -44.49 0.39 C -35.94 0.39, -27.39 0.39, -18.83 0.39 Z" class="pickup-rout" />
            
            <circle cx="0" cy="0" r="1.5" fill="#28a745" />
          </g>
        

    <!-- Family-specific bridge hardware and scale-length reference line -->
    <g id="bridge-hardware">
      <rect x="-42.00" y="273.43" width="84.00" height="46.00" rx="3.00" ry="3.00" class="bridge-rout" />
      <line x1="-37.00" y1="285.43" x2="37.00" y2="285.43" stroke="#dc3545" stroke-width="0.3" />
      <g transform="translate(0, 288.63)"></g>
    </g>
  </g>

  <!-- Title, Specs & Calibration Band (page space - never rotated) -->
  <g>
    <line x1="-169.20" y1="459.90" x2="231.62" y2="459.90" class="band-rule" />
    <text x="-157.20" y="479.90" class="title-label">Mustang-Style Bass - 1:1 Scale Print Template</text>
    <text x="-157.20" y="492.90" class="text-label">Scale: 762.0mm (30.00") | Joint: 63.5mm W x 98.425mm D | Saddle Y: 288.6mm</text>
    <text x="-157.20" y="502.90" class="text-label">Date: 2026-08-28 | Printable 100% True Scale (Do Not Scale Page)</text>
