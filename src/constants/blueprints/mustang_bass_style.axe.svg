    <project:schemaVersion>3</project:schemaVersion>
    <project:instrumentType>bass</project:instrumentType>
    <project:stringCount>4</project:stringCount>
    <project:appVersion>1.0.0</project:appVersion>
    <project:data></project:data>
  </metadata>

  <style>
    .body-line { fill: none; stroke: #111111; stroke-width: 0.4; stroke-linecap: round; stroke-linejoin: round; }
