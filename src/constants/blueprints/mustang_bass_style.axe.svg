    <path d="M -31.75 0.00 C -35.87 8.74, -30.99 12.77, -41.58 12.79 C -65.63 12.85, -80.97 -45.93, -99.69 -45.49 C -114.11 -45.15, -122.13 -29.22, -122.49 -8.28 C -123.22 33.81, -100.63 80.84, -100.96 124.30 C -101.33 172.89, -152.31 222.91, -153.72 297.10 C -154.20 322.44, -143.78 368.51, -100.31 397.55 C -78.47 412.14, -48.90 420.87, 0.03 431.80 C 26.67 437.75, 84.53 444.90, 118.88 424.20 C 145.88 407.93, 151.06 379.66, 151.28 359.43 C 151.62 328.07, 141.79 306.15, 130.29 285.79 C 122.09 271.24, 104.32 244.33, 103.35 216.26 C 102.51 192.12, 109.26 178.66, 115.57 157.46 C 120.46 141.04, 123.92 125.62, 123.26 98.09 C 122.74 76.75, 111.56 51.72, 92.89 50.27 C 76.41 48.99, 73.11 58.91, 55.43 59.33 C 36.67 59.78, 32.73 50.59, 24.55 38.66 C 24.55 38.66, 31.75 0.00, 31.75 0.00 C 13.42 0.25, -9.68 -0.24, -31.75 0.00 Z" class="body-line" />
    

