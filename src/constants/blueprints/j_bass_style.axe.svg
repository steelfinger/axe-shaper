            <circle cx="0" cy="0" r="1.5" fill="#28a745" />
          </g>
        

    <!-- Family-specific bridge hardware and scale-length reference line -->
    <g id="bridge-hardware">
      <rect x="-40.52" y="296.98" width="81.03" height="53.09" rx="3.00" ry="3.00" class="bridge-rout" />
      <rect x="-40.52" y="300.18" width="81.03" height="53.09" rx="3.00" ry="3.00" class="bridge-rout" />
      <line x1="-35.52" y1="323.48" x2="35.52" y2="323.48" stroke="#dc3545" stroke-width="0.3" />
      <g transform="translate(0, 326.68)"></g>
    </g>
  </g>

  <!-- Title, Specs & Calibration Band (page space - never rotated) -->
  <g>
    <line x1="-194.60" y1="526.98" x2="256.73" y2="526.98" class="band-rule" />
    <text x="-182.60" y="546.98" class="title-label">J-Style Bass - 1:1 Scale Print Template</text>
    <text x="-182.60" y="559.98" class="text-label">Scale: 863.6mm (34.00") | Joint: 63.5mm W x 98.425mm D | Saddle Y: 326.7mm</text>
