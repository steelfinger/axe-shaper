    <text x="180.73" y="326.48" class="axis-label" fill="#007bff">Scale Line (323.5mm)</text>

    <!-- Back Routed Cavities (drawn under the body so a front view can't see them) -->
    

    <!-- Outer Custom Body Profile -->
    <path d="M -31.75 0.00 C -31.44 13.00, -36.91 26.11, -56.95 25.01 C -73.26 24.12, -91.56 8.57, -99.28 -16.77 C -108.08 -45.65, -96.58 -75.17, -117.48 -78.22 C -146.56 -82.47, -158.80 -24.66, -155.40 19.86 C -150.86 79.45, -126.05 122.56, -126.58 170.46 C -127.12 219.48, -179.60 302.71, -179.54 383.91 C -179.51 419.15, -171.83 454.19, -141.96 476.90 C -99.02 509.54, -72.56 510.04, 2.17 511.00 C 78.56 511.98, 107.92 507.30, 140.39 479.23 C 168.81 454.65, 176.73 416.06, 176.06 385.05 C 174.26 302.06, 125.21 223.59, 125.93 189.98 C 126.93 143.57, 153.05 119.92, 154.29 63.20 C 154.89 35.88, 149.40 5.22, 125.78 5.96 C 100.93 6.74, 120.91 48.25, 88.24 74.56 C 68.78 90.24, 42.01 82.62, 31.67 67.36 C 31.67 67.36, 31.75 0.00, 31.75 0.00 C 8.55 0.32, -3.82 -0.30, -31.75 0.00 Z" class="body-line" />
    

