      y="0"
      width="63.5"
      height="98.425"
      rx="6.35"
      ry="6.35"
      class="neck-pocket"
    />

    <!-- Front Routed Cavities (control cavities, etc. - under pickup hardware) -->
    

    <!-- Pickup routing cavities and visible cover cut lines (above front routes) -->
    
          <g transform="translate(0, 220) rotate(0)">
            <path d="M -43.52 -10.65 C -43.52 -10.65, 43.52 -10.65, 43.52 -10.65 C 45.28 -10.65, 46.70 -9.23, 46.70 -7.47 C 46.70 -7.47, 46.70 7.47, 46.70 7.47 C 46.70 9.23, 45.28 10.65, 43.52 10.65 C 43.52 10.65, -43.52 10.65, -43.52 10.65 C -45.28 10.65, -46.70 9.23, -46.70 7.47 C -46.70 7.47, -46.70 -7.47, -46.70 -7.47 C -46.70 -9.23, -45.28 -10.65, -43.52 -10.65 Z" class="pickup-rout" />
            
