  width="394.93mm"
  height="741.49mm"
  viewBox="-163.26 -15.43 394.93 741.49"
>
  <metadata>
    <project:name>Thunderbird</project:name>
    <project:units>millimeters</project:units>
    <project:schemaVersion>2</project:schemaVersion>
    <project:appVersion>1.0.0</project:appVersion>
    <project:data></project:data>
  </metadata>

  <style>
    .body-line { fill: none; stroke: #111111; stroke-width: 0.4; stroke-linecap: round; stroke-linejoin: round; }
    .edge-inset { fill: none; stroke: #555555; stroke-width: 0.3; stroke-dasharray: 3,2; }
    .neck-pocket { fill: #e5e7eb; stroke: #374151; stroke-width: 0.4; }
    .pickup-rout { fill: none; stroke: #28a745; stroke-width: 0.3; }
    .bridge-rout { fill: none; stroke: #007bff; stroke-width: 0.3; }
    .back-route { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 0.3; stroke-dasharray: 3,2; }
    .front-route { fill: #ccfbf1; stroke: #0f766e; stroke-width: 0.3; }
    .pickguard { fill: #ffffff; fill-opacity: 0.35; stroke: #6b7280; stroke-width: 0.3; }
    .center-axis { fill: none; stroke: #6c757d; stroke-width: 0.2; stroke-dasharray: 6,4; opacity: 0.7; }
    .calibration-box { fill: none; stroke: #d9534f; stroke-width: 0.4; stroke-dasharray: 3,3; }
    .band-rule { fill: none; stroke: #adb5bd; stroke-width: 0.2; }
    .text-label { font-family: monospace, sans-serif; font-size: 5px; fill: #d9534f; }
    .disclaimer-label { font-family: monospace, sans-serif; font-size: 4.5px; font-style: italic; fill: #6c757d; }
    .axis-label { font-family: monospace, sans-serif; font-size: 5px; fill: #6c757d; }
    .title-label { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #222222; }
  </style>

  <!-- Guitar Geometry Group -->
  <g>
    <!-- Centerline Alignment Axis (X = 0) -->
    <line x1="0" y1="-15.43" x2="0" y2="545.06" class="center-axis" />

    <!-- Joint Line Marker (Y = 0) -->
    <line x1="-163.26" y1="0" x2="151.67" y2="0" class="center-axis" />
    <text x="155.67" y="3" class="axis-label">Y=0 (Joint Line)</text>

    <!-- Theoretical Saddle Line Marker -->
    <line x1="-163.26" y1="249.41" x2="151.67" y2="249.41" class="center-axis" stroke="#007bff" />
    <text x="155.67" y="252.41" class="axis-label" fill="#007bff">Scale Line (249.4mm)</text>

    <!-- Back Routed Cavities (drawn under the body so a front view can't see them) -->
    <path d="M 49.81 322.74 C 67.18 296.64, 87.24 301.65, 102.46 331.86 C 102.46 331.86, 133.53 386.94, 133.53 386.94 C 142.79 404.20, 127.67 422.43, 106.21 421.36 C 106.21 421.36, 41.23 419.22, 41.23 419.22 C 22.46 421.36, 4.85 406.74, 13.15 386.61 C 13.15 386.61, 49.81 322.74, 49.81 322.74 Z" class="back-route" />

