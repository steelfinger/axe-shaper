    <path d="M -19.05 0.00 C -19.05 0.00, -23.75 0.05, -23.75 0.05 C -23.09 20.46, -31.48 37.64, -49.18 37.29 C -75.99 36.76, -94.44 1.04, -113.29 0.93 C -131.44 0.82, -137.57 36.56, -137.24 72.82 C -136.66 136.46, -111.70 197.30, -112.64 232.64 C -113.50 264.93, -123.96 312.06, -135.49 360.75 C -148.13 414.15, -148.26 465.16, -143.18 506.12 C -140.20 530.06, -124.74 528.13, -118.78 522.59 C -118.78 522.59, -38.75 454.33, -38.75 454.33 C -38.75 454.33, -31.08 462.22, -31.08 462.22 C -31.08 462.22, 31.30 461.17, 31.30 461.17 C 37.28 446.17, 51.06 436.11, 64.10 436.07 C 82.06 436.02, 108.18 462.60, 125.61 462.00 C 148.88 461.18, 151.67 443.92, 150.44 408.72 C 148.63 356.52, 104.43 286.27, 104.11 246.40 C 103.82 210.91, 120.42 195.10, 121.17 143.50 C 121.53 119.03, 115.60 120.58, 108.91 113.98 C 108.91 113.98, 34.19 63.98, 34.19 63.98 C 28.05 59.41, 26.14 54.99, 25.29 48.42 C 25.29 48.42, 25.54 0.53, 25.54 0.53 C 25.54 0.53, 19.05 0.00, 19.05 0.00 C -1.22 -0.43, 1.22 0.04, -19.05 0.00 Z" class="body-line" />
    

    <!-- Pickguard (translucent, above the body, under the hardware) -->
    <path d="M 23.09 66.72 C 23.09 66.72, 110.43 125.96, 110.43 125.96 C 114.21 148.99, 110.16 177.92, 99.35 214.91 C 99.35 214.91, 28.58 195.59, 28.58 195.59 C 28.58 195.59, 28.88 174.66, 28.88 174.66 C 28.88 174.66, 22.61 174.14, 22.61 174.14 C 22.61 174.14, 23.06 124.05, 23.06 124.05 C 23.06 124.05, 28.47 123.38, 28.47 123.38 C 28.47 123.38, 28.86 89.72, 28.86 89.72 C 28.86 89.72, 22.79 89.42, 22.79 89.42 C 22.79 89.42, 23.09 66.72, 23.09 66.72 Z" class="pickguard" style="fill:#ffffff" />

    <!-- Immutable Neck Pocket Cavity -->
    <rect
      x="-19.05"
      y="0"
      width="38.1"
      height="76.2"
      rx="6.35"
      ry="6.35"
      class="neck-pocket"
    />

    <!-- Front Routed Cavities (control cavities, etc. - under pickup hardware) -->
    

    <!-- Pickup Routing Cavities (kept above filled front routes so they remain identifiable) -->
    
          <g transform="translate(0, 107) rotate(0)">
            <rect x="-35.00" y="-19.00" width="70" height="38" rx="4" ry="4" class="pickup-rout" />
            <circle cx="0" cy="0" r="1.5" fill="#28a745" />
          </g>
        
          <g transform="translate(0, 191) rotate(0)">
            <rect x="-35.00" y="-19.00" width="70" height="38" rx="4" ry="4" class="pickup-rout" />
            <circle cx="0" cy="0" r="1.5" fill="#28a745" />
          </g>
        

    <!-- Family-specific bridge hardware and scale-length reference line -->
    <g id="bridge-hardware">
      <rect x="-42.00" y="242.41" width="84.00" height="14.00" rx="7.00" ry="7.00" class="bridge-rout" transform="rotate(-3 0.00 249.41)" />
      <rect x="-42.00" y="287.41" width="84.00" height="14.00" rx="7.00" ry="7.00" class="bridge-rout" />
      <line x1="-37.31" y1="249.41" x2="37.31" y2="249.41" stroke="#dc3545" stroke-width="0.3" />
      <g transform="translate(0, 249.41)"><circle cx="-37" cy="1.5" r="2" fill="#007bff" /><circle cx="37" cy="-1.5" r="2" fill="#007bff" /><circle cx="-41" cy="45" r="2" fill="#007bff" /><circle cx="41" cy="45" r="2" fill="#007bff" /></g>
    </g>
  </g>

  <!-- Title, Specs & Calibration Band (page space - never rotated) -->
  <g>
    <line x1="-163.26" y1="545.06" x2="231.67" y2="545.06" class="band-rule" />
    <text x="-151.26" y="565.06" class="title-label">Thunderbird - 1:1 Scale Print Template</text>
    <text x="-151.26" y="578.06" class="text-label">Scale: 628.6mm (24.75") | Joint: 38.1mm W x 76.2mm D | Saddle Y: 286.9mm</text>
    <text x="-151.26" y="588.06" class="text-label">Date: 2026-08-20 | Printable 100% True Scale (Do Not Scale Page)</text>
    <text x="-151.26" y="601.06" class="disclaimer-label">Editing this file in another app will not update Axe Shaper - re-importing it may discard your changes.</text>

    <!-- 100mm x 100mm Ruler Calibration Box -->
    <g transform="translate(-151.26, 613.06)">
      <rect x="0" y="0" width="100" height="100" class="calibration-box" />
      <text x="5" y="15" class="text-label" font-weight="bold">CALIBRATION BOX</text>
      <text x="5" y="30" class="text-label">100 mm x 100 mm</text>
      <text x="5" y="45" class="text-label">Measure with ruler</text>
      <text x="5" y="60" class="text-label">to verify 100% print</text>
    </g>
