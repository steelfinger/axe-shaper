<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:project="https://axe-shaper.app/ns/project/1"
  width="534.60mm"
  height="731.69mm"
  viewBox="-236.58 -70.36 534.60 731.69"
>
  <metadata>
    <project:name>V-Style Vintage</project:name>
    <project:units>millimeters</project:units>
    <project:schemaVersion>1</project:schemaVersion>
    <project:appVersion>1.0.0</project:appVersion>
    <project:data></project:data>
  </metadata>

  <style>
    .body-line { fill: none; stroke: #111111; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .neck-pocket { fill: none; stroke: #dc3545; stroke-width: 1.2; stroke-dasharray: 4,4; }
    .pickup-rout { fill: none; stroke: #28a745; stroke-width: 1.0; }
    .bridge-rout { fill: none; stroke: #007bff; stroke-width: 1.2; }
    .back-route { fill: none; stroke: #9333ea; stroke-width: 1.0; stroke-dasharray: 3,3; }
    .front-route { fill: none; stroke: #9333ea; stroke-width: 1.0; }
    .pickguard { fill: #ffffff; fill-opacity: 0.35; stroke: #6b7280; stroke-width: 1.0; }
    .center-axis { fill: none; stroke: #6c757d; stroke-width: 0.5; stroke-dasharray: 6,4; opacity: 0.7; }
    .calibration-box { fill: none; stroke: #d9534f; stroke-width: 0.8; stroke-dasharray: 3,3; }
    .band-rule { fill: none; stroke: #adb5bd; stroke-width: 0.5; }
    .text-label { font-family: monospace, sans-serif; font-size: 5px; fill: #d9534f; }
    .axis-label { font-family: monospace, sans-serif; font-size: 5px; fill: #6c757d; }
    .title-label { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #222222; }
  </style>

  <!-- Guitar Geometry Group -->
  <g>
    <!-- Centerline Alignment Axis (X = 0) -->
    <line x1="0" y1="-70.36" x2="0" y2="496.32" class="center-axis" />

    <!-- Joint Line Marker (Y = 0) -->
    <line x1="-236.58" y1="0" x2="218.02" y2="0" class="center-axis" />
    <text x="222.02" y="3" class="axis-label">Y=0 (Joint Line)</text>

    <!-- Theoretical Saddle Line Marker -->
    <line x1="-236.58" y1="195.04" x2="218.02" y2="195.04" class="center-axis" stroke="#007bff" />
    <text x="222.02" y="198.04" class="axis-label" fill="#007bff">Scale Line (195.0mm)</text>

    <!-- Back Routed Cavities (drawn under the body so a front view can't see them) -->
    <path d="M -70.00 220.00 C -70.00 220.00, -30.00 220.00, -30.00 220.00 C -30.00 220.00, -30.00 300.00, -30.00 300.00 C -30.00 300.00, -70.00 300.00, -70.00 300.00 C -70.00 300.00, -70.00 220.00, -70.00 220.00 Z" class="back-route" />

    <!-- Outer Custom Body Profile -->
    <path d="M -19.05 0.00 C -19.05 0.00, -29.68 -0.02, -29.68 -0.02 C -36.07 10.09, -46.77 15.77, -60.26 18.98 C -60.26 18.98, -211.77 437.89, -211.77 437.89 C -221.58 461.20, -191.88 481.32, -174.89 463.55 C -174.89 463.55, -29.08 299.07, -29.08 299.07 C -12.22 281.65, 9.91 281.18, 26.96 299.22 C 26.96 299.22, 173.59 465.29, 173.59 465.29 C 190.57 479.36, 218.02 463.87, 209.89 441.86 C 209.89 441.86, 58.96 20.40, 58.96 20.40 C 45.50 17.77, 36.93 11.80, 26.68 0.80 C 26.68 0.80, 19.05 0.00, 19.05 0.00 C -1.22 -0.43, 1.22 0.04, -19.05 0.00 Z" class="body-line" />

    <!-- Pickguard (translucent, above the body, under the hardware) -->
    <path d="M -26.00 -2.00 C -33.89 -0.33, -37.29 15.37, -45.00 13.00 C -59.42 8.56, -68.64 -6.16, -78.00 -18.00 C -85.21 -27.12, -84.27 -55.36, -94.00 -49.00 C -114.73 -35.45, -128.50 -8.72, -130.00 16.00 C -132.40 55.48, -101.88 92.57, -105.00 132.00 C -108.46 175.72, -164.01 214.79, -149.00 256.00 C -137.29 288.14, -82.98 273.93, -50.00 283.00 C -33.31 287.59, -17.31 297.17, 0.00 297.00 C 18.36 296.82, 35.25 286.70, 53.00 282.00 C 85.59 273.37, 138.44 288.29, 151.00 257.00 C 165.90 219.89, 111.42 184.84, 108.00 145.00 C 105.12 111.41, 133.00 80.71, 133.00 47.00 C 133.00 31.84, 122.98 6.68, 108.00 9.00 C 89.08 11.94, 91.93 47.06, 75.00 56.00 C 63.20 62.23, 44.61 57.19, 36.00 47.00 C 25.24 34.27, 39.08 8.34, 26.00 -2.00 C 12.40 -12.75, -9.04 -5.58, -26.00 -2.00 Z" class="pickguard" style="fill:#ffffff" />

    <!-- Immutable Neck Pocket Cavity -->
    <rect
      x="-19.05"
      y="0"
      width="38.1"
      height="67"
      rx="6.35"
      ry="6.35"
      class="neck-pocket"
    />

    <!-- Pickup Routing Cavities -->
    
          <g transform="translate(0, 46.04) rotate(0)">
            <rect x="-35.00" y="-19.00" width="70" height="38" rx="4" ry="4" class="pickup-rout" />
            <circle cx="0" cy="0" r="1.5" fill="#28a745" />
          </g>
        
          <g transform="translate(0, 151.61) rotate(0)">
            <rect x="-35.00" y="-19.00" width="70" height="38" rx="4" ry="4" class="pickup-rout" />
            <circle cx="0" cy="0" r="1.5" fill="#28a745" />
          </g>
        

    <!-- Front Routed Cavities (control cavities, etc. - alongside the pickup routs) -->
    <path d="M 30.00 200.00 C 30.00 200.00, 70.00 200.00, 70.00 200.00 C 70.00 200.00, 70.00 280.00, 70.00 280.00 C 70.00 280.00, 30.00 280.00, 30.00 280.00 C 30.00 280.00, 30.00 200.00, 30.00 200.00 Z" class="front-route" />

    <!-- Bridge Hardware Plate, Saddle Line & Mounting Holes -->
    <g transform="translate(0, 198.04)">
      <rect x="-42.00" y="-7.00" width="84" height="14" class="bridge-rout" />
      <line x1="-37.00" y1="0" x2="37.00" y2="0" stroke="#dc3545" stroke-width="1.2" />
      <circle cx="-37" cy="0" r="2" fill="#007bff" /><circle cx="37" cy="0" r="2" fill="#007bff" /><circle cx="-41" cy="45" r="2" fill="#007bff" /><circle cx="41" cy="45" r="2" fill="#007bff" />
    </g>
  </g>

  <!-- Title, Specs & Calibration Band (page space - never rotated) -->
  <g>
    <line x1="-236.58" y1="496.32" x2="298.02" y2="496.32" class="band-rule" />
    <text x="-224.58" y="516.32" class="title-label">V-Style Vintage - 1:1 Scale Print Template</text>
    <text x="-224.58" y="529.32" class="text-label">Scale: 628.6mm (24.75") | Joint: 38.1mm W x 67mm D | Saddle Y: 198.0mm</text>
    <text x="-224.58" y="539.32" class="text-label">Date: 2026-08-06 | Printable 100% True Scale (Do Not Scale Page)</text>

    <!-- 100mm x 100mm Ruler Calibration Box -->
    <g transform="translate(-224.58, 548.32)">
      <rect x="0" y="0" width="100" height="100" class="calibration-box" />
      <text x="5" y="15" class="text-label" font-weight="bold">CALIBRATION BOX</text>
      <text x="5" y="30" class="text-label">100 mm x 100 mm</text>
      <text x="5" y="45" class="text-label">Measure with ruler</text>
      <text x="5" y="60" class="text-label">to verify 100% print</text>
    </g>
  </g>
</svg>