<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:project="https://axe-shaper.app/ns/project/1"
  width="558.91mm"
  height="778.02mm"
  viewBox="-247.38 -15.43 558.91 778.02"
>
  <metadata>
    <project:name>V-Style Vintage</project:name>
    <project:units>millimeters</project:units>
    <project:schemaVersion>2</project:schemaVersion>
    <project:appVersion>1.0.0</project:appVersion>
    <project:data></project:data>
  </metadata>

  <style>
    .body-line { fill: none; stroke: #111111; stroke-width: 0.4; stroke-linecap: round; stroke-linejoin: round; }
    .edge-inset { fill: none; stroke: #555555; stroke-width: 0.3; stroke-dasharray: 3,2; }
    .neck-pocket { fill: #e5e7eb; stroke: #374151; stroke-width: 0.4; }
    .pickup-rout { fill: none; stroke: #28a745; stroke-width: 0.3; }
    .bridge-rout { fill: none; stroke: #007bff; stroke-width: 0.3; }
    .back-route { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 0.3; stroke-dasharray: 3,2; }
    .front-route { fill: #ccfbf1; stroke: #0f766e; stroke-width: 0.3; }
    .pickguard { fill: #ffffff; fill-opacity: 0.35; stroke: #6b7280; stroke-width: 0.3; }
    .center-axis { fill: none; stroke: #6c757d; stroke-width: 0.2; stroke-dasharray: 6,4; opacity: 0.7; }
    .calibration-box { fill: none; stroke: #d9534f; stroke-width: 0.4; stroke-dasharray: 3,3; }
    .band-rule { fill: none; stroke: #adb5bd; stroke-width: 0.2; }
    .text-label { font-family: monospace, sans-serif; font-size: 5px; fill: #d9534f; }
    .disclaimer-label { font-family: monospace, sans-serif; font-size: 4.5px; font-style: italic; fill: #6c757d; }
    .axis-label { font-family: monospace, sans-serif; font-size: 5px; fill: #6c757d; }
    .title-label { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #222222; }
  </style>

  <!-- Guitar Geometry Group -->
  <g>
    <!-- Centerline Alignment Axis (X = 0) -->
    <line x1="0" y1="-15.43" x2="0" y2="581.59" class="center-axis" />

    <!-- Joint Line Marker (Y = 0) -->
    <line x1="-247.38" y1="0" x2="231.54" y2="0" class="center-axis" />
    <text x="235.54" y="3" class="axis-label">Y=0 (Joint Line)</text>

    <!-- Theoretical Saddle Line Marker -->
    <line x1="-247.38" y1="250.41" x2="231.54" y2="250.41" class="center-axis" stroke="#007bff" />
    <text x="235.54" y="253.41" class="axis-label" fill="#007bff">Scale Line (250.4mm)</text>

    <!-- Back Routed Cavities (drawn under the body so a front view can't see them) -->
    

    <!-- Outer Custom Body Profile -->
    <path d="M -19.05 0.00 C -19.05 0.00, -28.76 52.91, -28.76 52.91 C -31.06 71.59, -37.00 74.05, -60.04 76.86 C -60.04 76.86, -220.11 517.77, -220.11 517.77 C -232.38 545.37, -200.43 566.59, -179.76 543.90 C -179.76 543.90, -24.84 365.03, -24.84 365.03 C -12.28 351.91, 10.58 350.70, 23.64 364.74 C 23.64 364.74, 182.06 547.53, 182.06 547.53 C 199.97 565.29, 231.54 546.91, 221.87 522.74 C 221.87 522.74, 58.96 77.31, 58.96 77.31 C 34.68 74.07, 32.32 66.26, 26.68 52.80 C 26.68 52.80, 19.05 0.00, 19.05 0.00 C -1.22 -0.43, 1.22 0.04, -19.05 0.00 Z" class="body-line" />
    

    <!-- Pickguard (translucent, above the body, under the hardware) -->
    <path d="M 45.92 182.39 C 45.92 182.39, 46.04 230.18, 46.04 230.18 C 46.04 230.18, 17.49 229.95, 17.49 229.95 C 17.49 229.95, 17.21 280.72, 17.21 280.72 C 17.21 280.72, 170.68 460.52, 170.68 460.52 C 172.54 462.70, 174.39 461.04, 173.56 458.21 C 173.56 458.21, 58.71 87.07, 58.71 87.07 C 56.66 83.46, 49.12 80.99, 46.63 81.53 C 46.63 81.53, 46.98 125.23, 46.98 125.23 C 46.98 125.23, -43.46 125.77, -43.46 125.77 C -43.46 125.77, -43.75 182.69, -43.75 182.69 C -43.75 182.69, 45.92 182.39, 45.92 182.39 Z" class="pickguard" style="fill:#ffffff" />

    <!-- Immutable Neck Pocket Cavity -->
    <rect
      x="-19.05"
      y="0"
      width="38.1"
      height="67"
      rx="6.35"
      ry="6.35"
      class="neck-pocket"
    />

    <!-- Front Routed Cavities (control cavities, etc. - under pickup hardware) -->
    <path d="M 76.80 234.81 C 84.35 224.88, 106.11 229.24, 105.71 248.69 C 105.31 269.74, 95.56 267.96, 101.69 287.10 C 112.26 320.08, 136.26 357.10, 143.81 372.19 C 154.65 392.64, 130.00 409.10, 117.47 392.16 C 107.94 376.67, 54.91 301.61, 51.58 281.75 C 49.19 267.50, 70.85 245.93, 76.80 234.81 Z" class="front-route" />

    <!-- Pickup Routing Cavities (kept above filled front routes so they remain identifiable) -->
    
          <g transform="translate(0, 104.30751189687955) rotate(0)">
            <rect x="-35.00" y="-19.00" width="70" height="38" rx="4" ry="4" class="pickup-rout" />
            <circle cx="0" cy="0" r="1.5" fill="#28a745" />
          </g>
        
          <g transform="translate(0, 205.63635051731427) rotate(0)">
            <rect x="-35.00" y="-19.00" width="70" height="38" rx="4" ry="4" class="pickup-rout" />
            <circle cx="0" cy="0" r="1.5" fill="#28a745" />
          </g>
        

    <!-- Family-specific bridge hardware and scale-length reference line -->
    <g id="bridge-hardware">
      <rect x="-42.00" y="243.41" width="84.00" height="14.00" rx="7.00" ry="7.00" class="bridge-rout" transform="rotate(-3 0.00 250.41)" />
      <rect x="-42.00" y="288.41" width="84.00" height="14.00" rx="7.00" ry="7.00" class="bridge-rout" />
      <line x1="-37.31" y1="250.41" x2="37.31" y2="250.41" stroke="#dc3545" stroke-width="0.3" />
      <g transform="translate(0, 250.41)"><circle cx="-37" cy="1.5" r="2" fill="#007bff" /><circle cx="37" cy="-1.5" r="2" fill="#007bff" /><circle cx="-41" cy="45" r="2" fill="#007bff" /><circle cx="41" cy="45" r="2" fill="#007bff" /></g>
    </g>
  </g>

  <!-- Title, Specs & Calibration Band (page space - never rotated) -->
  <g>
    <line x1="-247.38" y1="581.59" x2="311.54" y2="581.59" class="band-rule" />
    <text x="-235.38" y="601.59" class="title-label">V-Style Vintage - 1:1 Scale Print Template</text>
    <text x="-235.38" y="614.59" class="text-label">Scale: 628.6mm (24.75") | Joint: 38.1mm W x 67mm D | Saddle Y: 287.9mm</text>
    <text x="-235.38" y="624.59" class="text-label">Date: 2026-08-20 | Printable 100% True Scale (Do Not Scale Page)</text>
    <text x="-235.38" y="637.59" class="disclaimer-label">Editing this file in another app will not update Axe Shaper - re-importing it may discard your changes.</text>

    <!-- 100mm x 100mm Ruler Calibration Box -->
    <g transform="translate(-235.38, 649.59)">
      <rect x="0" y="0" width="100" height="100" class="calibration-box" />
      <text x="5" y="15" class="text-label" font-weight="bold">CALIBRATION BOX</text>
      <text x="5" y="30" class="text-label">100 mm x 100 mm</text>
      <text x="5" y="45" class="text-label">Measure with ruler</text>
      <text x="5" y="60" class="text-label">to verify 100% print</text>
    </g>
  </g>
</svg>